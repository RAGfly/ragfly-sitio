<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="960" role="img" aria-label="Manifiesto">
      <style>
        /* Cada documento se autoriza por turno: gris (pendiente) → ÁMBAR
           (a bordo). El desfase encadena los tres, de arriba hacia abajo. */
        .mf-dot { fill: #AAAAAA; animation: mfDot 4.2s ease-in-out infinite; }
        .mf-dot.d2 { animation-delay: .5s; }
        .mf-dot.d3 { animation-delay: 1s; }
        @keyframes mfDot {
          0%, 12%   { fill: #AAAAAA; }
          22%, 72%  { fill: #E8A33D; }
          85%, 100% { fill: #AAAAAA; }
        }
        @media (prefers-reduced-motion: reduce) {
          .mf-dot { animation: none; fill: #E8A33D; }
        }
      </style>
