<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="960" role="img" aria-label="Panel de instrumentos — telemetría en vivo, las cifras quedan fijas, solo el estado respira">
  <style>
    /* Las tres cifras (42.180 / 21 / 98,4%) NO se animan: son datos reales,
       no un contador inventado (familia F: solo cifras reales). Lo que respira
       es el estado del sistema: encendido en cadena + el punto de autorización. */
    .F .stat { opacity: 0; animation: F-statIn 7s ease-in-out infinite; }
    .F .stat.s2 { animation-delay: .35s; }
    .F .stat.s3 { animation-delay: .7s; }
    @keyframes F-statIn {
      0%, 4%    { opacity: 0; }
      16%, 88%  { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    .F .dot { transform-box: fill-box; transform-origin: center; animation: F-dotPulse 3s ease-in-out infinite; }
    @keyframes F-dotPulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.5); opacity: .5; }
    }
    .F .scan { animation: F-scan 7s linear infinite; }
    @keyframes F-scan {
      0%          { transform: translateY(0);    opacity: 0; }
      6%          { opacity: .8; }
      46%         { transform: translateY(96px); opacity: .8; }
      54%, 100%   { transform: translateY(96px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .F .stat { animation: none; opacity: 1; }
      .F .dot  { animation: none; transform: none; opacity: 1; }
      .F .scan { animation: none; opacity: 0; }
    }
  </style>
  <rect x="0" y="0" width="480" height="250" fill="#0b2233"/>
      <g class="F">
        <g clip-path="none">
          <rect class="scan" x="34" y="42" width="412" height="1" fill="#8fd0f2" opacity="0"/>
        </g>
        <g font-family="ui-monospace,monospace">
          <g><text x="34" y="52" font-size="9" fill="#4a708a" letter-spacing="1.6">DOCUMENTOS</text>
             <text x="34" y="88" font-size="30" fill="#D5ECF8">42.180</text></g>
          <g><text x="196" y="52" font-size="9" fill="#4a708a" letter-spacing="1.6">ENTIDADES</text>
             <text x="196" y="88" font-size="30" fill="#D5ECF8">21</text></g>
          <g><text x="330" y="52" font-size="9" fill="#4a708a" letter-spacing="1.6">TIPIFICADOS</text>
             <text x="330" y="88" font-size="30" fill="#D5ECF8">98,4<tspan font-size="16">%</tspan></text></g>
          <g stroke="#123c56"><path d="M34 118 L446 118"/></g>
          <g class="stat s1"><text x="34" y="150" font-size="9" fill="#4a708a" letter-spacing="1.6">RERANK</text>
             <text x="34" y="176" font-size="15" fill="#8fd0f2">activo</text></g>
          <g class="stat s2"><text x="196" y="150" font-size="9" fill="#4a708a" letter-spacing="1.6">AISLAMIENTO</text>
             <text x="196" y="176" font-size="15" fill="#8fd0f2">verificado</text></g>
          <g class="stat s3"><text x="330" y="150" font-size="9" fill="#4a708a" letter-spacing="1.6">ESTADO</text>
             <text x="330" y="176" font-size="15" fill="#E8A33D">autorizado</text></g>
          <circle class="dot" cx="424" cy="170" r="4.5" fill="#E8A33D"/>
          <text x="34" y="220" font-size="9" fill="#2b5470" letter-spacing="1.4">p95 · SLOT DE PRUEBA — PENDIENTE DE MEDIR</text>
        </g>
      </g>
    </svg>
