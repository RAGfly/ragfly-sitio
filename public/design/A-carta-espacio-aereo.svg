<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="960" role="img" aria-label="Carta de espacio aéreo — tres entidades aisladas, cada una con su propio tráfico">
      <style>
        .lane { stroke: #AAD8F1; stroke-width: 1; opacity: .45; }
        .blip { fill: #008BD6; filter: drop-shadow(0 0 2px rgba(0,139,214,.55)); animation: travel linear infinite; }
        .blip.amber { fill: #E8A33D; filter: drop-shadow(0 0 2.5px rgba(232,163,61,.6)); }
        @keyframes travel {
          0%   { offset-distance: 0%;   opacity: 0; }
          10%  { opacity: 1; }
          88%  { opacity: 1; }
          100% { offset-distance: 100%; opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .blip { animation: none; opacity: 0; }
        }
      </style>

      <rect x="14" y="14" width="452" height="222" rx="10" fill="none" stroke="#AAD8F1" stroke-dasharray="5 4"/>
      <text x="26" y="34" font-family="ui-monospace,monospace" font-size="10" fill="#55B2E4" letter-spacing="1.5">GRUPO · TU CUENTA</text>
      <g fill="none" stroke="#008BD6" stroke-width="1.3">
        <rect x="36" y="52" width="126" height="164" rx="8"/>
        <rect x="178" y="52" width="126" height="164" rx="8"/>
        <rect x="320" y="52" width="126" height="164" rx="8"/>
      </g>
      <g font-family="ui-monospace,monospace" font-size="9.5" fill="#005D8F" letter-spacing="1.2">
        <text x="48" y="72">ENT · 01</text><text x="190" y="72">ENT · 02</text><text x="332" y="72">ENT · 03</text>
      </g>
      <g fill="#D5ECF8">
        <rect x="48" y="86" width="102" height="7" rx="3.5"/><rect x="48" y="99" width="80" height="7" rx="3.5"/>
        <rect x="48" y="112" width="94" height="7" rx="3.5"/>
        <rect x="190" y="86" width="88" height="7" rx="3.5"/><rect x="190" y="99" width="102" height="7" rx="3.5"/>
        <rect x="332" y="86" width="96" height="7" rx="3.5"/><rect x="332" y="99" width="72" height="7" rx="3.5"/>
        <rect x="332" y="112" width="88" height="7" rx="3.5"/>
      </g>

      <!-- tráfico interno: cada carril vive DENTRO de su propia entidad, ninguno la cruza -->
      <g>
        <line class="lane" x1="48" y1="138" x2="150" y2="132"/>
        <line class="lane" x1="48" y1="151" x2="150" y2="158"/>
        <circle class="blip" r="2.4" style="offset-path: path('M 48 138 L 150 132'); animation-duration: 2.4s; animation-delay: 0s;"/>
        <circle class="blip" r="2.4" style="offset-path: path('M 48 151 L 150 158'); animation-duration: 2.9s; animation-delay: .8s;"/>
      </g>
      <g>
        <line class="lane" x1="190" y1="140" x2="292" y2="135"/>
        <line class="lane" x1="190" y1="154" x2="292" y2="150"/>
        <circle class="blip" r="2.4" style="offset-path: path('M 190 140 L 292 135'); animation-duration: 2.7s; animation-delay: 1.3s;"/>
        <circle class="blip" r="2.4" style="offset-path: path('M 190 154 L 292 150'); animation-duration: 2.2s; animation-delay: .3s;"/>
      </g>

      <!-- consulta autorizada: viaja, se enciende y se apaga — no sale del borde de ENT·01 -->
      <g stroke="#E8A33D" stroke-width="1.4" fill="none" opacity=".55">
        <path d="M60 190 L138 168"/>
      </g>
      <circle class="blip amber" r="3.2" style="offset-path: path('M 60 190 L 138 168'); animation-duration: 3.1s; animation-delay: 0s;"/>

      <text x="48" y="208" font-family="ui-monospace,monospace" font-size="8.5" fill="#AAAAAA" letter-spacing="1">CONSULTA · AUTORIZADA</text>
      <g stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3 4">
        <path d="M162 134 L178 134"/><path d="M304 134 L320 134"/>
      </g>
      <text x="196" y="208" font-family="ui-monospace,monospace" font-size="8.5" fill="#AAAAAA" letter-spacing="1">SIN CRUCE</text>
    </svg>
