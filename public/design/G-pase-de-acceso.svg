<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="960" role="img" aria-label="Dos zonas de acceso aisladas, cada una con su propio abanico de rayos, en bandas separadas que nunca se cruzan">
      <style>
        .ga-lane { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; opacity: .16; }
        .ga-lane-core { stroke: #ffffff; stroke-width: .8; opacity: .45; }
        .ga-group { animation: gaTravel linear infinite; }
        .ga-halo { fill: #35b6ff; opacity: .3; }
        .ga-core { fill: #eaf7ff; filter: drop-shadow(0 0 2.5px rgba(53,182,255,.9)); }
        .ga-group.amber .ga-halo { fill: #ffb84d; }
        .ga-group.amber .ga-core { fill: #fff3df; filter: drop-shadow(0 0 3px rgba(255,184,77,.95)); }
        @keyframes gaTravel {
          0%   { offset-distance: 0%;   opacity: 0; }
          8%   { opacity: 1; }
          90%  { opacity: 1; }
          100% { offset-distance: 100%; opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .ga-group { animation: none; opacity: 0; }
        }
      </style>

      <rect x="0" y="0" width="480" height="260" fill="#060a10"/>

      <!-- zona 1 — banda superior (y 18–108), nunca baja de ahí -->
      <g>
        <line class="ga-lane" x1="40" y1="108" x2="446" y2="18"/>
        <line class="ga-lane" x1="40" y1="108" x2="446" y2="42"/>
        <line class="ga-lane" x1="40" y1="108" x2="446" y2="66"/>
        <line class="ga-lane" x1="40" y1="108" x2="446" y2="88"/>
        <line class="ga-lane" x1="40" y1="108" x2="446" y2="106"/>
        <line class="ga-lane-core" x1="40" y1="108" x2="446" y2="18"/>
        <line class="ga-lane-core" x1="40" y1="108" x2="446" y2="42"/>
        <line class="ga-lane-core" x1="40" y1="108" x2="446" y2="66"/>
        <line class="ga-lane-core" x1="40" y1="108" x2="446" y2="88"/>
        <line class="ga-lane-core" x1="40" y1="108" x2="446" y2="106"/>
        <circle cx="40" cy="108" r="2.6" fill="#eaf7ff" filter="drop-shadow(0 0 2px rgba(255,255,255,.7))"/>

        <g class="ga-group" style="offset-path: path('M 40 108 L 446 18'); animation-duration: 2.7s; animation-delay: 0s;">
          <circle class="ga-halo" r="9"/><circle class="ga-core" r="3.2"/>
        </g>
        <g class="ga-group amber" style="offset-path: path('M 40 108 L 446 42'); animation-duration: 3.3s; animation-delay: 1s;">
          <circle class="ga-halo" r="10"/><circle class="ga-core" r="3.6"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 40 108 L 446 66'); animation-duration: 3s; animation-delay: 1.7s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 40 108 L 446 88'); animation-duration: 2.4s; animation-delay: .5s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 40 108 L 446 106'); animation-duration: 3.5s; animation-delay: 2.2s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
      </g>

      <!-- zona 2 — banda inferior (y 152–242), separada de la zona 1 por una franja vacía -->
      <g>
        <line class="ga-lane" x1="40" y1="152" x2="446" y2="168"/>
        <line class="ga-lane" x1="40" y1="152" x2="446" y2="190"/>
        <line class="ga-lane" x1="40" y1="152" x2="446" y2="212"/>
        <line class="ga-lane" x1="40" y1="152" x2="446" y2="234"/>
        <line class="ga-lane" x1="40" y1="152" x2="446" y2="242"/>
        <line class="ga-lane-core" x1="40" y1="152" x2="446" y2="168"/>
        <line class="ga-lane-core" x1="40" y1="152" x2="446" y2="190"/>
        <line class="ga-lane-core" x1="40" y1="152" x2="446" y2="212"/>
        <line class="ga-lane-core" x1="40" y1="152" x2="446" y2="234"/>
        <line class="ga-lane-core" x1="40" y1="152" x2="446" y2="242"/>
        <circle cx="40" cy="152" r="2.6" fill="#eaf7ff" filter="drop-shadow(0 0 2px rgba(255,255,255,.7))"/>

        <g class="ga-group" style="offset-path: path('M 40 152 L 446 168'); animation-duration: 3.7s; animation-delay: .6s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 40 152 L 446 190'); animation-duration: 3.1s; animation-delay: 1.9s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 40 152 L 446 212'); animation-duration: 3.4s; animation-delay: .2s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 40 152 L 446 234'); animation-duration: 2.9s; animation-delay: 1.2s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 40 152 L 446 242'); animation-duration: 2.6s; animation-delay: 2.6s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
      </g>
    </svg>
