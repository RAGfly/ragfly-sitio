<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="960" role="img" aria-label="Dos zonas de acceso aisladas, cada una con su propio abanico de rayos, sin tocarse">
      <style>
        .ga-lane { stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; opacity: .16; }
        .ga-lane-core { stroke: #ffffff; stroke-width: .8; opacity: .45; }
        .ga-group { animation: gaTravel linear infinite; }
        .ga-halo { fill: #35b6ff; opacity: .3; }
        .ga-core { fill: #eaf7ff; filter: drop-shadow(0 0 2.5px rgba(53,182,255,.9)); }
        .ga-group.amber .ga-halo { fill: #ffb84d; }
        .ga-group.amber .ga-core { fill: #fff3df; filter: drop-shadow(0 0 3px rgba(255,184,77,.95)); }
        @keyframes gaTravel {
          0%   { offset-distance: 0%;   opacity: 0; }
          8%   { opacity: 1; }
          90%  { opacity: 1; }
          100% { offset-distance: 100%; opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .ga-group { animation: none; opacity: 0; }
        }
      </style>

      <rect x="0" y="0" width="480" height="250" fill="#060a10"/>

      <!-- zona 1 — origen arriba, abanico corto -->
      <g>
        <line class="ga-lane" x1="196" y1="150" x2="366" y2="46"/>
        <line class="ga-lane" x1="196" y1="150" x2="378" y2="72"/>
        <line class="ga-lane" x1="196" y1="150" x2="386" y2="100"/>
        <line class="ga-lane" x1="196" y1="150" x2="392" y2="130"/>
        <line class="ga-lane" x1="196" y1="150" x2="396" y2="160"/>
        <line class="ga-lane-core" x1="196" y1="150" x2="366" y2="46"/>
        <line class="ga-lane-core" x1="196" y1="150" x2="378" y2="72"/>
        <line class="ga-lane-core" x1="196" y1="150" x2="386" y2="100"/>
        <line class="ga-lane-core" x1="196" y1="150" x2="392" y2="130"/>
        <line class="ga-lane-core" x1="196" y1="150" x2="396" y2="160"/>
        <circle cx="196" cy="150" r="2.6" fill="#eaf7ff" filter="drop-shadow(0 0 2px rgba(255,255,255,.7))"/>

        <g class="ga-group" style="offset-path: path('M 196 150 L 366 46'); animation-duration: 2.7s; animation-delay: 0s;">
          <circle class="ga-halo" r="9"/><circle class="ga-core" r="3.2"/>
        </g>
        <g class="ga-group amber" style="offset-path: path('M 196 150 L 378 72'); animation-duration: 3.3s; animation-delay: 1s;">
          <circle class="ga-halo" r="10"/><circle class="ga-core" r="3.6"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 196 150 L 386 100'); animation-duration: 3s; animation-delay: 1.7s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 196 150 L 392 130'); animation-duration: 2.4s; animation-delay: .5s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 196 150 L 396 160'); animation-duration: 3.5s; animation-delay: 2.2s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
      </g>

      <!-- zona 2 — origen abajo a la izquierda, abanico largo — nunca cruza a la zona 1 -->
      <g>
        <line class="ga-lane" x1="102" y1="188" x2="446" y2="168"/>
        <line class="ga-lane" x1="102" y1="188" x2="440" y2="200"/>
        <line class="ga-lane" x1="102" y1="188" x2="430" y2="228"/>
        <line class="ga-lane" x1="102" y1="188" x2="414" y2="252"/>
        <line class="ga-lane-core" x1="102" y1="188" x2="446" y2="168"/>
        <line class="ga-lane-core" x1="102" y1="188" x2="440" y2="200"/>
        <line class="ga-lane-core" x1="102" y1="188" x2="430" y2="228"/>
        <line class="ga-lane-core" x1="102" y1="188" x2="414" y2="252"/>
        <circle cx="102" cy="188" r="2.6" fill="#eaf7ff" filter="drop-shadow(0 0 2px rgba(255,255,255,.7))"/>

        <g class="ga-group" style="offset-path: path('M 102 188 L 446 168'); animation-duration: 3.7s; animation-delay: .6s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 102 188 L 440 200'); animation-duration: 3.1s; animation-delay: 1.9s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 102 188 L 430 228'); animation-duration: 3.4s; animation-delay: .2s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
        <g class="ga-group" style="offset-path: path('M 102 188 L 414 252'); animation-duration: 2.9s; animation-delay: 1.2s;">
          <circle class="ga-halo" r="8"/><circle class="ga-core" r="3"/>
        </g>
      </g>
    </svg>
